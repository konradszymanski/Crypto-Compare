name: Verify and deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check data-client.js
          node --check tests/data-client.test.js
          node --check comparison-core.js
          node --check cycle-core.js
          node --check macro-core.js
          node --check scripts/update-macro-data.mjs
          node --check macro-core.js
          node --check event-core.js
          node --check playwright.config.js
          node --check tests/global-setup.js
          node --check tests/static-server.js
          node --check tests/browser/comparison.spec.js
          node --check treasuries.js
          node --check structure.js
          node --check scripts/update-treasury-data.mjs
      - name: Run unit tests
        run: npm test
      - name: Run browser tests
        run: npm run test:e2e

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4


